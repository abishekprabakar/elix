[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elix"
version = "0.1.0"
description = "The controller for agent spend. Approves, pays, books and explains every dollar AI agents spend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "anthropic>=2.0",
    "x402[evm,fastapi,httpx]>=2.25",
    "eth-account>=0.13",
    "mcp>=2.0",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["coincurve>=20"]
samples = ["reportlab>=4"]

[project.scripts]
elix = "elix.cli:app"

[tool.setuptools.packages.find]
include = ["elix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
